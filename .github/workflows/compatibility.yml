name: Sangse compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.9.0', '22']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Quantitative source regressions (offline)
        run: python -m unittest discover -s tests -p test_numerical_provenance.py -v
      - name: Humanize approval regressions (offline)
        run: python -m unittest discover -s tests -p test_humanize_approval.py -v
      - name: Wadiz bridge and release provenance (offline)
        run: node --test tests/test_wadiz_bridge.mjs tests/test_release_contract.mjs
